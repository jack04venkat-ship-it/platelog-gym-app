*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 Barlow,system-ui,sans-serif}

.brand{font:700 28px "Barlow Condensed",Impact,sans-serif;display:flex;align-items:center;gap:10px}
.plate{width:26px;height:26px;border-radius:50%;background:var(--plate);box-shadow:inset 0 0 0 7px var(--plate),inset 0 0 0 9px rgba(0,0,0,.35);position:relative}
.plate:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--bg)}
.seg{display:flex;border:2px solid var(--pri);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;color:var(--pri);font:600 16px Barlow,sans-serif;padding:8px 20px;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--onpri)}
.who{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--mut)}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=number]{width:72px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;color:var(--mut);font:700 20px "Barlow Condensed",sans-serif;padding:8px 14px;cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);border-color:var(--plate)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;font:600 15px Barlow,sans-serif;cursor:pointer}
.pill.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.btn{border:0;background:var(--pri);color:var(--onpri);font:600 15px Barlow,sans-serif;padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.row .n{flex:1}
.hd{color:var(--mut);font-size:14px;margin-bottom:4px}
.set{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.set.done{color:var(--ok)}
.sn{min-width:58px;color:var(--mut)}
.pickd{width:100%;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.big{font:700 44px/1 "Barlow Condensed",sans-serif}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.stats .card{margin:0}
.mut{color:var(--mut);font-size:14px}
.sp{width:100%;height:64px}.ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}.dt{fill:var(--accent)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--plate)}
.lift{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
@media(max-width:520px){.lift{grid-template-columns:1fr}}
footer{text-align:center;margin:20px 0}
.linked{border-left:4px solid var(--plate);padding-left:8px}.card.linked{padding-left:12px}
</style>

function head(){const cs=mine(),c=C();return(bn?`<p role="alert" style="color:var(--bad)">${esc(bn)}</p>`:'')+`<header><div class="brand"><span class="plate"></span>PlateLog</div><div class="who" style="margin:0"><span>${esc(me.name)} <span class="mut">(${me.role=='t'?'trainer':'client'})</span></span><button class="btn ghost" data-a="logout">${cloud&&lo?'Confirm log out':'Log out'}</button></div></header>`
+(me.role=='t'&&cs.length?`<div class="who"><label>Client <select data-f="pick">${cs.map(x=>`<option value="${x.id}" ${c&&x.id==c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div>`:'')
+(me.role=='c'&&c?`<div class="who">Your trainer: ${esc((S.users.find(u=>u.id==c.tid)||{}).name||'')}</div>`:'')}
const tabs=(list,cur)=>`<div class="tabs">${list.map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${k==cur?'on':''}">${l}</button>`).join('')}</div>`;

const TT=[['clients','Clients'],['workout','Workout'],['diet','Diet'],['progress','Progress']];
function trainer(){const c=C();if(!c||tt=='clients')return tabs(TT,'clients')+clientsHtml();let h=tabs(TT,tt);
 if(tt=='workout'){const L=c.plan[day]||[];
  h+=`<div class="pills">${DAYS.map(d=>`<button class="pill ${d==day?'on':''}" data-a="day" data-v="${d}">${d}${(c.plan[d]||[]).length?'':' (rest)'}</button>`).join('')}</div>
  <div class="card"><h3>${FULL[DAYS.indexOf(day)]} for ${esc(c.name)}</h3>
  ${L.some(e=>!isC(e.n))?`<div class="row hd"><span class="n">Exercise</span><span style="width:72px">Sets</span><span style="width:72px">Reps</span><span style="width:72px">Kg</span><span style="width:34px"></span></div>`:L.length?'':'<p class="mut">Rest day. Add an exercise to make this a training day.</p>'}
  ${L.map((e,i)=>{const lk=e.ss||(i>0&&L[i-1].ss);return`<div class="${lk?'linked':''}"><div class="row"><select class="n" data-f="ex" data-i="${i}" data-k="n" aria-label="Exercise">${opts(e.n)}</select>${isC(e.n)?'':`<input type="number" data-f="ex" data-i="${i}" data-k="s" value="${e.s}" aria-label="Sets"><input type="number" data-f="ex" data-i="${i}" data-k="r" value="${e.r}" aria-label="Reps"><input type="number" step="0.5" data-f="ex" data-i="${i}" data-k="w" value="${e.w}" aria-label="Weight in kg">`}<button class="btn ghost" data-a="rm" data-i="${i}" aria-label="Remove exercise">✕</button></div><div class="row" style="margin:-2px 0 14px 12px;flex-wrap:wrap"><select data-f="ex" data-i="${i}" data-k="q" aria-label="Variation">${vopts(e.n,e.q)}</select><span class="mut">${esc(muscle(e.n,e.q))}</span>${isC(e.n)?`<label class="mut"><input type="number" data-f="ex" data-i="${i}" data-k="r" value="${e.r}" aria-label="Minutes"> min</label><label class="mut"><input type="number" step="0.1" data-f="ex" data-i="${i}" data-k="w" value="${e.w}" aria-label="Distance in km"> km</label>`:''}${i<L.length-1?`<label class="mut"><input type="checkbox" data-f="ss" data-i="${i}" ${e.ss?'checked':''}> Superset with next</label>`:''}</div></div>`}).join('')}
  <select data-f="addex" aria-label="Add exercise" style="width:100%"><option value="">+ Choose an exercise to add…</option>${opts('')}</select></div>
  <p class="mut">Changes save automatically and show up in the client app straight away.</p>`}
 if(tt=='diet')h+=`<div class="card"><h3>Daily targets for ${esc(c.name)}</h3>
  <div class="row" style="margin-top:10px"><label>Calories <input type="number" data-f="diet" data-k="kcal" value="${c.diet.kcal}"></label><label>Protein (g) <input type="number" data-f="diet" data-k="protein" value="${c.diet.protein}"></label></div>
  <label class="mut">Meal guidance<br><textarea data-f="diet" data-k="note" rows="4" style="width:100%">${esc(c.diet.note)}</textarea></label></div>
  <div class="card"><h3>Eaten today</h3><p class="mut">Shared by the client</p><div class="big">${eaten(c)} <span class="mut">of ${c.diet.kcal} kcal</span></div><div class="bar"><i style="width:${Math.min(100,eaten(c)/c.diet.kcal*100)}%"></i></div></div>`;
 if(tt=='progress'){const planned=DAYS.filter(d=>(c.plan[d]||[]).length).length,cut=ago(6);
  const done=new Set(c.logs.filter(l=>l.d>=cut).map(l=>l.d)).size,pct=planned?Math.min(100,Math.round(done/planned*100)):0;
  h+=`<div class="stats"><div class="card"><div class="mut">Body weight</div><div class="big">${bw(c)} kg</div></div><div class="card"><div class="mut">Sessions this week</div><div class="big">${done}/${planned}</div><div class="bar"><i style="width:${pct}%"></i></div></div><div class="card"><div class="mut">Today: eaten / burned</div><div class="big">${eaten(c)} / ${burned(c)}</div></div></div>
  <div class="card"><h3>Body weight trend</h3>${spark(c.weights.map(w=>w.v))}</div>
  <div class="card"><h3>Strength by lift</h3>${liftsHtml(c)}</div>
  ${done<2&&planned?`<div class="card" style="border-color:var(--bad)"><b>Low adherence.</b> ${esc(c.name)} has trained ${done} of ${planned} planned days this week.</div>`:''}`}

function client(){const c=C();if(!c)return`<div class="card"><h3>No trainer linked</h3><p class="mut">Ask your trainer for an invite code, then enter it here.</p><div class="row"><input id="link-code" placeholder="Invite code" style="text-transform:uppercase"><button class="btn" data-a="link">Link trainer</button></div></div>`;let h=tabs([['today','Today'],['food','Food'],['me','Progress']],ct);
 if(ct=='today'){const L=c.plan[TD]||[];h+=`<h2>${FULL[TI]}</h2>`;
  if(!L.length)h+='<p class="mut">Rest day. Log your food and weight instead.</p>';
  const sr=(i,s,nm)=>{const e=L[i],lg=c.logs.find(l=>l.d==TODAY&&l.ex==e.n&&l.q==e.q&&l.s==s),k=i+'-'+s,lab=nm?`<span class="sn" style="flex:1;min-width:130px">${esc(e.n)}, set ${s}</span>`:`<span class="sn">${isC(e.n)?'Session':'Set '+s}</span>`;
   return lg?`<div class="set done">${lab}<b>${isC(e.n)?`${lg.r} min, ${lg.w} km`:`${lg.r} reps × ${lg.w} kg`}</b><button class="btn ghost" data-a="unlog" data-e="${i}" data-s="${s}">Undo</button></div>`
   :`<div class="set">${lab}<input type="number" data-f="dr" data-k="${k}-r" value="${draft[k+'-r']??e.r}" aria-label="${isC(e.n)?'Minutes':'Reps'}"> ${isC(e.n)?'min':'reps'} <input type="number" step="0.5" data-f="dr" data-k="${k}-w" value="${draft[k+'-w']??e.w}" aria-label="${isC(e.n)?'Distance in km':'Weight in kg'}"> ${isC(e.n)?'km':'kg'} <button class="btn" data-a="log" data-e="${i}" data-s="${s}">Log set</button></div>`};
  const G=[];L.forEach((e,i)=>{if(i>0&&L[i-1].ss)G[G.length-1].push(i);else G.push([i])});
  G.forEach(g=>{const m=g.length>1;
   h+=`<div class="card${m?' linked':''}">${m?'<h3>Superset</h3><div class="mut">Do one set of each exercise back to back, then rest.</div>':''}`;
   g.forEach(i=>{const e=L[i],d=`<div class="mut">${esc(e.q)} for ${esc(muscle(e.n,e.q))}. Target ${isC(e.n)?`${e.r} min`+(e.w?`, ${e.w} km`:''):`${e.s} × ${e.r} at ${e.w} kg`}</div>`;h+=m?`<div style="margin-top:10px"><b>${esc(e.n)}</b>${d}</div>`:`<h3>${esc(e.n)}</h3>${d}`});
   if(m){for(let s=1;s<=Math.max(...g.map(i=>L[i].s));s++)g.forEach(i=>{if(s<=L[i].s)h+=sr(i,s,1)})}else for(let s=1;s<=L[g[0]].s;s++)h+=sr(g[0],s,0);
   h+='</div>'})}
 if(ct=='food'){const eat=eaten(c),bn=burned(c),net=eat-bn;
  h+=`<div class="stats"><div class="card"><div class="mut">Eaten</div><div class="big">${eat}</div></div><div class="card"><div class="mut">Burned (estimate)</div><div class="big">${bn}</div></div><div class="card"><div class="mut">Net of ${c.diet.kcal} target</div><div class="big">${net}</div></div></div>
  <div class="card"><h3>Add food</h3><input id="fq" value="${esc(fqv)}" placeholder="Search a South Indian dish, e.g. masala dosa" autocomplete="off" aria-label="Search dish" style="width:100%;margin:8px 0"><div id="fs">${fsHtml()}</div><p class="mut" style="margin-top:12px">Not in the list? Add it yourself:</p><div class="row"><input class="n" id="fn" placeholder="Food name"><input type="number" id="fk" placeholder="kcal"><button class="btn" data-a="food">Add</button></div>
  ${c.food.filter(f=>f.d==TODAY).map((f,i)=>`<div class="set"><span style="flex:1">${esc(f.n)}</span><b>${f.k} kcal</b><button class="btn ghost" data-a="rmfood" data-i="${c.food.indexOf(f)}" aria-label="Remove">✕</button></div>`).join('')||'<p class="mut">Nothing logged today. Add your first meal above.</p>'}</div>
  <div class="card"><h3>Workout burn</h3><p class="mut">Estimated from body weight and time. Strength training counts once you log a set, and cardio is added from the minutes you log.</p><label>Strength minutes <input type="number" data-f="mins" value="${c.mins}"></label></div>
  <p class="mut">Your trainer sees these totals.</p>`}
 if(ct=='me')h+=`<div class="card"><h3>Update body weight</h3><div class="row" style="margin-top:8px"><input type="number" step="0.1" id="bw" value="${bw(c)}"> kg <button class="btn" data-a="weight">Save weight</button></div>${spark(c.weights.map(w=>w.v))}</div><div class="card"><h3>Your lifts</h3>${liftsHtml(c)}</div>`;
 return h}

 else if(a=='link'){const code=(document.getElementById('link-code').value||'').trim().toUpperCase();if(!code)return;try{const{error}=await sb.rpc('redeem_invite',{invite_code:code});if(error)throw error;const{error:metadataError}=await sb.auth.updateUser({data:{invite_code:null}});if(metadataError)throw metadataError;bn='';amsg='';await loadCloud()}catch(e){bn=e.message;amsg=e.message;render()}return}

 save();render()});

 if(f=='ex'){const e=c.plan[day][+t.dataset.i],k=t.dataset.k;if(k=='n'){const was=isC(e.n);e.n=t.value;e.q=vars(e.n)[0].v;if(was!=isC(e.n)){e.s=isC(e.n)?1:3;e.r=isC(e.n)?20:10;e.w=0}save();render();return}if(k=='q'){e.q=t.value;save();render();return}e[k]=+t.value}

 if(!cloud)return`<header><div class="brand"><span class="plate"></span>PlateLog</div></header><div class="card" style="max-width:560px;margin:24px auto"><h2>Connect Supabase</h2><p>This app needs your Supabase project URL and publishable key before it can save shared data. Run the SQL in <b>supabase-setup.sql</b>, then replace the two configuration placeholders near the top of index.html. Never use a service-role key in this app.</p></div>`;

${am=='up'&&ar=='c'?`<p><label>Invite code from your trainer<br><input id="a-c" value="${v('a-c')}" style="width:100%;text-transform:uppercase" autocomplete="off"></label></p>`:''}
${amsg?`<p role="alert" style="color:var(--bad)">${esc(amsg)}</p>`:''}
<button class="btn" style="width:100%" data-a="go">${am=='in'?'Log in':'Create account'}</button>

async function auth(a,v){
 const fail=m=>{amsg=m;af['a-p']='';render()};
 if(a=='am'){am=v;amsg='';render();return}
 if(a=='ar'){ar=v;amsg='';render();return}
 if(a!='go')return;
 const email=(af['a-e']||'').trim().toLowerCase(),password=af['a-p']||'';
 if(!email||!password)return fail('Enter your email and password.');
 try{
  if(am=='in'){
   const{data,error}=await sb.auth.signInWithPassword({email,password});
   if(error)throw error;
   await enterSession(data.user);
  }else{
   const name=(af['a-n']||'').trim(),invite=(af['a-c']||'').trim().toUpperCase();
   if(!name)return fail('Enter your name.');
   if(password.length<6)return fail('Use a password with at least 6 characters.');
   if(ar=='c'&&!invite)return fail('Enter the invite code from your trainer.');
   const{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:window.location.origin+window.location.pathname,data:{name,role:ar,invite_code:ar=='c'?invite:null}}});
   if(error)throw error;
   if(data.session)await enterSession(data.user);
   else{am='in';amsg='Check your email to confirm your account, then log in. If you signed up as a client, your invite code will be applied after confirmation.';render()}
  }
 }catch(e){if(me)cloudErr(e);else fail(e.message||'Authentication failed. Please try again.')}
}
async function enterSession(user){
 authUser=user;
 const{data:profile,error}=await sb.from('profiles').select('id,role,name').eq('id',user.id).single();
 if(error)throw error;
 if(!profile)throw new Error('Your account profile is missing. Run the Supabase setup SQL and try again.');
 me={id:profile.id,role:profile.role,name:profile.name,email:user.email};
 if(me.role=='c'&&user.user_metadata.invite_code){
  const{error:linkError}=await sb.rpc('redeem_invite',{invite_code:user.user_metadata.invite_code});
  if(!linkError){
   const{error:metadataError}=await sb.auth.updateUser({data:{invite_code:null}});
   if(metadataError)throw metadataError;
  }else{amsg='Account created, but the invite code could not be linked. Enter a valid code below.';bn=amsg}
 }
 role=me.role;tt=role=='t'?'clients':'workout';ct='today';draft={};af={};lo=false;
 await loadCloud();
}
document.addEventListener('keydown',ev=>{if(ev.key=='Enter'&&!me&&ev.target.id&&ev.target.id.slice(0,2)=='a-')auth('go')});
const clone=o=>JSON.parse(JSON.stringify(o));
function cloudErr(e){const details=e&&e.message?e.message:(e&&e.code)||'Unknown error';amsg='Could not save or load data: '+details;bn=amsg;render()}
async function cloudSave(){
 if(!me)return;
 try{
  for(const c of mine()){
   const signature=JSON.stringify([c.name,c.email,c.invite,c.plan,c.diet,c.logs,c.food,c.weights,c.mins]);
   if(persisted.get(c.id)===signature)continue;
   if(me.role=='t'){
    const fields={email:c.email,name:c.name,invite:c.invite,plan:c.plan,diet:c.diet};
    let result;
    if(c._new){
     result=await sb.from('clients').insert({id:c.id,tid:me.id,...fields});
     if(result.error)throw result.error;
     c._new=false;
    }else{
     result=await sb.from('clients').update(fields).eq('id',c.id).eq('tid',me.id);
     if(result.error)throw result.error;
    }
    if(c._needsData){
     const{error:dataError}=await sb.from('client_data').insert({client_id:c.id,logs:c.logs,food:c.food,weights:c.weights,mins:c.mins});
     if(dataError)throw dataError;
     c._needsData=false;
    }
   }else{
    const{error}=await sb.from('client_data').upsert({client_id:c.id,logs:c.logs,food:c.food,weights:c.weights,mins:c.mins},{onConflict:'client_id'});
    if(error)throw error;
   }
   persisted.set(c.id,signature);
  }
 }catch(e){cloudErr(e)}
}
function scheduleRefresh(){
 if(!me)return;
 const active=document.activeElement;
 if(active&&/^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName)){pend=true;return}
 clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>loadCloud().catch(cloudErr),200);
}
async function loadCloud(){
 if(!sb||!authUser)return;
 const[profiles,clients,data]=await Promise.all([
  sb.from('profiles').select('id,role,name'),
  sb.from('clients').select('id,tid,uid,email,name,invite,plan,diet'),
  sb.from('client_data').select('client_id,logs,food,weights,mins')
 ]);
 if(profiles.error)throw profiles.error;
 if(clients.error)throw clients.error;
 if(data.error)throw data.error;
 S.users=profiles.data||[];
 const byId=new Map((data.data||[]).map(row=>[row.client_id,row]));
 S.clients=(clients.data||[]).map(row=>{
  const d=byId.get(row.id)||{};
  return Object.assign({},row,{
   plan:row.plan||{},diet:row.diet||{kcal:2200,protein:120,note:''},
   logs:d.logs||[],food:d.food||[],weights:d.weights&&d.weights.length?d.weights:[{d:TODAY,v:70}],
   mins:d.mins||45,_new:false,_needsData:false
  });
 persisted.clear();S.clients.forEach(c=>persisted.set(c.id,JSON.stringify([c.name,c.email,c.invite,c.plan,c.diet,c.logs,c.food,c.weights,c.mins])));
 });
 const profile=S.users.find(x=>x.id==authUser.id);
 if(!profile)throw new Error('Your account profile is missing. Run the Supabase setup SQL and try again.');
 me={id:profile.id,role:profile.role,name:profile.name,email:authUser.email};
 role=me.role;
 if(!ini){tt=role=='t'?'clients':'workout';ct='today';ini=true}
 if(!mine().some(x=>x.id==cid))cid=(mine()[0]||{}).id||'';
 loading=false;
 const sig=JSON.stringify([S.users,S.clients,me]);
 if(sig==lastSig)return;
 lastSig=sig;
 const active=document.activeElement;
 if(active&&/^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName)){pend=true;return}
 render();
}
async function boot(){
 const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&SUPABASE_KEY&&!SUPABASE_KEY.includes('YOUR_');
 if(!configured||!window.supabase){loading=false;render();return}
 try{
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  cloud=true;
  const{data,error}=await sb.auth.getSession();
  if(error)throw error;
  if(data.session)await enterSession(data.session.user);
  else{loading=false;render()}
  sb.channel('platelog-sync')
   .on('postgres_changes',{event:'*',schema:'public',table:'clients'},scheduleRefresh)
   .on('postgres_changes',{event:'*',schema:'public',table:'client_data'},scheduleRefresh)
   .subscribe();
 }catch(e){loading=false;cloudErr(e)}
}
document.addEventListener('focusout',()=>{if(pend){pend=false;setTimeout(()=>loadCloud().catch(cloudErr),60)}});
boot();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
